name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build every program, warnings as errors
        run: make EXTRA_CFLAGS=-Werror
      - name: Clean leaves no stray files
        run: |
          make clean
          test -z "$(git status --porcelain)"
